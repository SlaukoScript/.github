name: Nuxt App CI (reusable)

# Reusable workflow for SlaukoScript Nuxt apps (gymtrack, moderation, web).
# Caller passes the image name; this workflow runs:
#   1. checks (lint + typecheck + test)
#   2. build (nuxt build → uploads .output as artifact on push-to-main)
#   3. image (downloads .output, packs lean node:22-alpine image, pushes to GHCR)
#
# Pattern proven on gymtrack PR #2 (verified 104s wall-clock) + Phase 1.5
# rollouts: gymtrack 146s, moderation 214s, web 152s — all with image
# build folded into the same workflow (no workflow_run gymnastics).
#
# Caller shape:
#   jobs:
#     ci:
#       uses: SlaukoScript/.github/.github/workflows/nuxt-app-ci.yml@main
#       with:
#         image-name: gymtrack
#       secrets: inherit
#
# `secrets: inherit` exposes PACKAGES_READ_TOKEN (org-level PAT) to both
# the install step (pnpm with @slaukoscript snapshots) and the image-push
# step (ghcr.io login).

on:
  workflow_call:
    inputs:
      image-name:
        description: 'GHCR image name (e.g. gymtrack)'
        required: true
        type: string
      node-version:
        description: 'Node version'
        required: false
        type: string
        default: '22'
    secrets:
      PACKAGES_READ_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    name: Lint + Typecheck + Test
    runs-on: [self-hosted]
    timeout-minutes: 10
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean stale pnpm installation
        run: rm -rf ~/setup-pnpm
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@slaukoscript'
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check (non-blocking)
        run: pnpm check-types || true

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: [self-hosted]
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - name: Clean stale pnpm installation
        run: rm -rf ~/setup-pnpm
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@slaukoscript'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

      - name: Upload .output for image job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output
          path: .output
          retention-days: 1
          if-no-files-found: error
          compression-level: 6
          include-hidden-files: true

  image:
    name: Build & Push Image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download .output from build job
        uses: actions/download-artifact@v4
        with:
          name: nuxt-output
          path: .output

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGES_READ_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/slaukoscript/${{ inputs.image-name }}:${{ github.sha }}
            ghcr.io/slaukoscript/${{ inputs.image-name }}:latest
          cache-from: type=gha,scope=${{ inputs.image-name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image-name }}
